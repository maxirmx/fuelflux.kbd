name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: VID
            keypad_layout_vid: "ON"
            long_press_ms: 1000
          - name: legacy
            keypad_layout_vid: "OFF"
            long_press_ms: 1250

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DKEYPAD_LAYOUT_VID=${{ matrix.keypad_layout_vid }}
          -DKEYPAD_LONG_PRESS_MS=${{ matrix.long_press_ms }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
